name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -eux

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "FEHLER: Keine ZIP-Datei im Repository gefunden."
            exit 1
          fi

          echo "Gefundene ZIP-Datei:"
          echo "$ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          echo "Projektdateien:"
          find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f | sort

      - name: Verify Android project
        shell: bash
        run: |
          set -eux

          test -f "$GITHUB_WORKSPACE/project/settings.gradle.kts"
          test -f "$GITHUB_WORKSPACE/project/build.gradle.kts"
          test -f "$GITHUB_WORKSPACE/project/app/build.gradle.kts"
          test -f "$GITHUB_WORKSPACE/project/app/src/main/AndroidManifest.xml"

          echo "Android-Projekt wurde erfolgreich gefunden."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -eux

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          else
            echo "FEHLER: Android SDK wurde nicht gefunden."
            exit 1
          fi

          echo "Android SDK: $SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -executable | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "FEHLER: sdkmanager wurde nicht gefunden."
            find "$SDK" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eux

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -eux

          curl -fL --retry 5 \
            -o /tmp/gradle-8.13-bin.zip \
            "https://services.gradle.org/distributions/gradle-8.13-bin.zip"

          rm -rf /tmp/gradle-8.13
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp

          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

          /tmp/gradle-8.13/bin/gradle --version

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -eux

          gradle \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Check APK
        shell: bash
        run: |
          set -eux

          ls -lah project/app/build/outputs/apk/debug/

          test -n "$(find project/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioExtractAndroid-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
